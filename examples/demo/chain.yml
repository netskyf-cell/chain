# chain.yml for a team on Azure DevOps, Confluence and GitHub.
# Written by the setup agent, merged by the team. Chain reads it; nothing here is a secret.

team: Fleet Portal

# The team's own words. The board shows these, never Chain's role names.
vocabulary:
  group: Epic
  intent: Epic
  spec: Feature
  plan: User Story
  change: Pull request

# Where each source is read from. Access comes from the agent's own MCP connectors.
sources:
  - id: ado
    system: azure-devops
    project: fleet            # ADO project name
  - id: wiki
    system: confluence
    space: PRODUCT
  - id: gh
    system: github
    repositories: [example/fleet-portal]
  - id: adorepos
    system: ado-repos
    project: fleet

# Which document plays which role (ADR-0003).
roles:
  intent:
    - { source: ado, type: Epic }
    - { source: wiki, type: PRD }
  spec:
    - { source: ado, type: Feature, criteria_field: "Acceptance Criteria" }
  plan:
    - { source: ado, type: User Story }
  change:
    - { source: gh, link_keys: [ab-mention] }   # PRs point to stories with AB#123
    - { source: adorepos, link_keys: [native] }

# Custom source states mapped to Chain's four. Unlisted states use the defaults.
states:
  ado:
    Resolved: done

# What the collector reads.
collect:
  since_days: 90

# How rules recognise agent work (signal catalogue, section 4).
# A match on any pattern marks the commit, PR or review as agent work.
authorship:
  agents:
    - name: GitHub Copilot
      accounts: [Copilot, copilot-swe-agent]
      branch_prefixes: [copilot/]
      trailers: [Copilot]
    - name: Claude Code
      branch_prefixes: [claude/]
      trailers: [Claude]
  labels: [ai-generated]

# Thresholds the rules use. Defaults apply when absent.
rules:
  stalled_after_days: 28
  review_passes: [compliance]
